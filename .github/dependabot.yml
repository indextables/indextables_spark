version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # One grouped PR per ecosystem per week: every version update that survives the
    # `ignore` rules below lands in this single PR (major, minor and patch alike).
    # Spark/Delta/Iceberg and test-scope deps used to have their own groups; they now
    # travel together because CI is slow enough that separate PRs force a rebase-and-rerun
    # cascade. A bump that breaks CI should be dropped from the PR with
    # "@dependabot ignore <dependency>" rather than splitting the group.
    # Dependabot assigns a dependency to the first matching group and gives anything
    # unmatched its own PR, so the catch-all pattern must stay in place.
    groups:
      all-maven-updates:
        applies-to: version-updates
        patterns:
          - "*"
      # Security updates are raised when an advisory is published, not on the weekly
      # schedule, and are not grouped unless asked. Keep them in their own group so they
      # are never held behind (or blocked by) the weekly PR.
      maven-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    # These dependencies are pinned in pom.xml to match what Spark 3.5.x bundles.
    # Bumping them independently breaks at runtime/build time, so they must move
    # only as part of a deliberate Spark upgrade — not via dependabot. See the
    # property comments in pom.xml for the specific failure modes.
    ignore:
      # Pin 3.3.4 exactly: Spark 3.5.x ships shaded hadoop-client 3.3.4, and
      # hadoop-aws / hadoop-azure must match it. 3.4+ triggers NoSuchMethodError
      # (Configuration.getEnumSet) in S3AFileSystem.initialize; in-minor bumps
      # (e.g. 3.3.6) still mismatch the bundled client. The spark-4.x profiles
      # carry their own Hadoop versions, moved only with a Spark upgrade.
      - dependency-name: "org.apache.hadoop:*"
      # Pin 4.9.3: Spark 3.5.x's catalyst parser ATN is incompatible with 4.10+ runtimes.
      - dependency-name: "org.antlr:antlr4-runtime"
      - dependency-name: "org.antlr:antlr4-maven-plugin"
      # Pin 1.6.x: iceberg-core 1.10.1+ requires Avro 1.12, but Spark 3.5.x ships Avro 1.11.x.
      # Range-scoped so in-minor 1.6.x security patches still surface (and 1.6.x bumps
      # are grouped into the weekly Maven PR rather than being fully ignored).
      - dependency-name: "org.apache.iceberg:*"
        versions: [">=1.7.0"]
      # Pin 12.0.1 to match Spark 3.5.x's bundled Arrow.
      - dependency-name: "org.apache.arrow:*"
      # Stay on Scala 2.12.x for Spark 3.5.8 (Spark 3.5 supports 2.12/2.13 only, not 3.x).
      - dependency-name: "org.scala-lang:scala-library"
        versions: [">=2.13.0"]
    labels:
      - "type: chore"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      all-github-actions-updates:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "type: chore"
