name: Release

# Publishes one artifact per supported Spark version for an existing tag
# v<BASE> (e.g. v0.6.0). Each is versioned <BASE>_spark_<SPARKVER>
# (e.g. 0.6.0_spark_4.0.3) and contains the linux-x86_64 tantivy4java native
# library:
#   - Maven Central: io.indextables:indextables_spark:<BASE>_spark_<SPARKVER>
#     (pom, jar, sources, javadoc, linux-x86_64-shaded, jar-with-dependencies)
#   - the linux-x86_64-shaded jars attached to the GitHub Release for the tag
# <SPARKVER> is the spark.version that the profile sets in pom.xml at the tag.
# It changes when the Spark dependency is bumped. The Plan summary shows the
# exact versions next to the ones last published, and a publish run whose
# Spark versions differ from the last release stops in `plan` until the
# releaser has typed them into `expected-spark-versions`.
#
# How to run it
# -------------
# Actions -> Release -> Run workflow, on `main`, with the tag to release.
# `dry-run` is ticked by default: the run then builds, assembles and rehearses
# signing, and stops. Untick it to publish. Pushing a tag does not start a
# release. The runbook, including how to adopt this workflow, the release
# candidate rehearsal and how to abort, is in
# .github/scripts/release/README.md.
#
# Trust model
# -----------
# * `native` and `build` run the project's build (Maven, its plugins, its
#   dependencies, cargo) on the tagged commit. They have a read-only token, no
#   environment and no secrets, and restore nothing from a cache: the native
#   library is compiled in the run, from the commits pinned in
#   native-pins.txt.
# * `assemble`, `rehearse` and `publish` run no project code. They run the
#   scripts in .github/scripts/release from the commit this workflow was
#   started on, on files the build jobs produced. `assemble` treats those
#   files as untrusted: it accepts only the expected coordinates and file
#   names and writes a manifest of digests.
# * In this file, `publish` is the only job that names the `release`
#   environment, reads a secret or holds a token that can write. Beside the
#   signing key and the Central token it runs: the pinned checkout and
#   download-artifact actions, the release scripts, and gpg, zip, unzip, curl,
#   jq and gh from the runner image. No Maven, no JVM, nothing from the tagged
#   commit. It signs and uploads exactly the files in the manifest whose
#   digest `assemble` reported, and nothing else.
# * A dry run never starts `publish`, so it requests no approval and reads no
#   secret. `rehearse` runs the same verification, signing and bundle checks
#   as `publish`, with a throwaway key it generates and deletes.
#
# What this file cannot guarantee
# ------------------------------
# All of the above describes this file on `main`. It says nothing about other
# workflow files or other refs, and two things outside it decide whether the
# separation protects anything:
#
# * While GPG_PRIVATE_KEY, GPG_PASSPHRASE, CENTRAL_USERNAME and
#   CENTRAL_PASSWORD exist as repository-level secrets, every workflow on
#   every ref can read them, whatever this file does.
# * The tags v0.6.0-rc1 and v0.6.0-rc2 carry the previous release.yml, which
#   has a workflow_dispatch trigger. It can be dispatched on the tag ref and
#   then runs the old build beside the key. Only an environment that admits
#   `main` alone, holding the only copy of the secrets, closes that.
#
# The order in which to get there (secrets into the environment, environment
# narrowed to `main` with administrator bypass off, dry run, release candidate
# rehearsal, repository-level copies deleted) is in the README under
# "Adopting this workflow".

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to release (e.g. v0.6.0)'
        required: true
        type: string
      dry-run:
        description: 'Dry run: build, assemble and rehearse signing; upload nothing. Untick to publish.'
        type: boolean
        default: true
      expected-spark-versions:
        description: 'Spark versions expected in the artifact names, e.g. "3.5.9 4.0.4 4.1.3". Needed to publish when they differ from the last release; the dry run prints the value.'
        type: string
        default: ''
      skip-central:
        description: 'Skip Maven Central (GitHub Release only). No effect in a dry run.'
        type: boolean
        default: false
      replace-release-assets:
        description: 'Replace jars already attached to the GitHub Release when their content differs. Unticked: stop instead.'
        type: boolean
        default: false
  # To start a release from a pushed tag as well, add:
  #
  #   push:
  #     tags: ['v*']
  #
  # plan.sh already handles that event. A pushed tag runs the workflow file
  # and the scripts of the tagged commit, not those on main; see "Tag push or
  # dispatch" in the README before enabling it.

permissions: {}

defaults:
  run:
    shell: bash

env:
  SCRIPTS: release/.github/scripts/release

jobs:
  # ---------------------------------------------------------------------------
  # Validate the request, resolve the tag to a commit and work out the versions
  # to publish. Every later job uses that commit and must arrive at those
  # versions, so a tag that moves during the run changes nothing.
  # ---------------------------------------------------------------------------
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
      base: ${{ steps.plan.outputs.base }}
      versions: ${{ steps.plan.outputs.versions }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      central: ${{ steps.plan.outputs.central }}
    steps:
      # Full history: plan.sh checks that the tag's commit is on main.
      - name: Checkout (workflow commit, full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
          INPUT_EXPECTED_SPARK: ${{ inputs.expected-spark-versions }}
          INPUT_SKIP_CENTRAL: ${{ inputs.skip-central }}
        run: bash .github/scripts/release/plan.sh

  # ---------------------------------------------------------------------------
  # tantivy4java is Spark-independent: build the native (Rust) jar once, from
  # source, and share it with the three build legs. No cache: about 11 minutes
  # in every run, which is what each release run has taken so far.
  # ---------------------------------------------------------------------------
  native:
    name: tantivy4java (linux-x86_64, from source)
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      POM: src/pom.xml
      PINS: release/.github/scripts/release/native-pins.txt
      WORK: work/native
      OUT: out/native
    steps:
      - name: Checkout release scripts (workflow commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release
          sparse-checkout: .github/scripts/release
          persist-credentials: false

      - name: Checkout source (tagged commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          path: src
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Resolve pinned inputs
        run: bash "$SCRIPTS/build-native.sh" resolve

      - name: Prepare toolchain
        run: bash "$SCRIPTS/build-native.sh" toolchain

      - name: Build tantivy4java
        run: bash "$SCRIPTS/build-native.sh" build

      - name: Upload native build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux-x86_64
          path: out/native
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Build, unsigned, everything that is published for one Spark profile.
  # The profile list must match PROFILES in .github/scripts/release/lib.sh.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.profile }}
    needs: [plan, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        profile: [spark-3.5, spark-4.0, spark-4.1]
    steps:
      - name: Checkout release scripts (workflow commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release
          sparse-checkout: .github/scripts/release
          persist-credentials: false

      - name: Checkout source (tagged commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          path: src
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download native build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-linux-x86_64
          path: in/native

      - name: Build artifacts
        env:
          SRC: src
          PROFILE: ${{ matrix.profile }}
          BASE_VERSION: ${{ needs.plan.outputs.base }}
          EXPECTED_VERSIONS: ${{ needs.plan.outputs.versions }}
          NATIVE_DIR: in/native
          OUT: out/artifacts
        run: bash "$SCRIPTS/build-artifacts.sh"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-${{ matrix.profile }}
          path: out/artifacts
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Check what the build jobs produced and lay out exactly what will be signed
  # and uploaded. Runs the release scripts only; no project code.
  # ---------------------------------------------------------------------------
  assemble:
    name: Assemble
    needs: [plan, native, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      manifest-sha256: ${{ steps.assemble.outputs.manifest_sha256 }}
      versions: ${{ steps.assemble.outputs.versions }}
    steps:
      - name: Checkout release scripts (workflow commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release
          sparse-checkout: .github/scripts/release
          persist-credentials: false

      - name: Download native build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-linux-x86_64
          path: in/native

      # One directory per artifact: in/artifacts-<profile>/
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: in

      - name: Assemble
        id: assemble
        env:
          IN: in
          OUT: staging
          TAG: ${{ needs.plan.outputs.tag }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          BASE_VERSION: ${{ needs.plan.outputs.base }}
          EXPECTED_VERSIONS: ${{ needs.plan.outputs.versions }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash "$SCRIPTS/assemble.sh"

      - name: Upload staging directory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-staging
          path: staging
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Everything the publish job does before its first upload, with a throwaway
  # key: fetch and verify the staging directory, sign, bundle, check. Runs in
  # every run, so a publish run is rehearsed before it asks for approval.
  # ---------------------------------------------------------------------------
  rehearse:
    name: Rehearse signing (throwaway key)
    needs: [plan, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BASE_VERSION: ${{ needs.plan.outputs.base }}
      EXPECTED_VERSIONS: ${{ needs.plan.outputs.versions }}
      # Protects the throwaway key only; it is not a secret.
      GPG_PASSPHRASE: rehearsal
    steps:
      - name: Checkout release scripts (workflow commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release
          sparse-checkout: .github/scripts/release
          persist-credentials: false

      - name: Keep the keyring outside the workspace
        run: echo "GNUPGHOME=$RUNNER_TEMP/release-gnupg" >> "$GITHUB_ENV"

      - name: Download staging directory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-staging
          path: staging

      - name: Verify staging directory
        env:
          MANIFEST_SHA256: ${{ needs.assemble.outputs.manifest-sha256 }}
        run: bash "$SCRIPTS/verify-staging.sh" staging

      - name: Generate a throwaway key
        id: key
        run: bash "$SCRIPTS/signing-key.sh" generate

      - name: Sign and bundle
        env:
          SIGNING_KEY: ${{ steps.key.outputs.fingerprint }}
        run: bash "$SCRIPTS/sign-bundles.sh" staging bundles

      - name: Check bundles
        env:
          SIGNING_KEY: ${{ steps.key.outputs.fingerprint }}
        run: bash "$SCRIPTS/check-bundles.sh" bundles staging

      - name: Remove the throwaway key
        if: always()
        run: bash "$SCRIPTS/signing-key.sh" remove

      - name: Summary
        env:
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          {
            echo "### Rehearsal passed"
            echo
            echo "The staging directory was verified, signed with a throwaway key, bundled and checked. Those signatures and bundles are discarded with this job."
            if [[ "$MODE" == publish ]]; then
              echo
              echo "The publish job now waits for approval in the \`release\` environment. Review the Plan and Assemble summaries first."
            else
              echo
              echo "Dry run complete: nothing was uploaded and no release was created."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # The only job with the `release` environment, secrets and a write token.
  # Not started in a dry run: both the plan's verdict and the raw input have to
  # say "publish".
  #
  # One publish at a time. A second release waits here; a third replaces the
  # second in the queue (GitHub keeps one pending job per group).
  # ---------------------------------------------------------------------------
  publish:
    name: Sign and publish
    needs: [plan, assemble, rehearse]
    if: ${{ needs.plan.outputs.mode == 'publish' && !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
    runs-on: ubuntu-24.04
    # Three uploads of about 100 MB, each followed by the Portal's validation.
    # In the last release, build, upload and validation together took under
    # two minutes per version. The limit covers the scripts' own worst case
    # of 15 + 20 minutes per version.
    timeout-minutes: 120
    environment: release
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      BASE_VERSION: ${{ needs.plan.outputs.base }}
      EXPECTED_VERSIONS: ${{ needs.plan.outputs.versions }}
    steps:
      - name: Checkout release scripts (workflow commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release
          sparse-checkout: .github/scripts/release
          persist-credentials: false

      - name: Keep the keyring and upload state outside the workspace
        run: |
          echo "GNUPGHOME=$RUNNER_TEMP/release-gnupg" >> "$GITHUB_ENV"
          echo "CENTRAL_STATE=$RUNNER_TEMP/central-state" >> "$GITHUB_ENV"

      - name: Download staging directory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-staging
          path: staging

      - name: Verify staging directory
        env:
          MANIFEST_SHA256: ${{ needs.assemble.outputs.manifest-sha256 }}
        run: bash "$SCRIPTS/verify-staging.sh" staging

      - name: Import the signing key
        id: key
        if: needs.plan.outputs.central == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: bash "$SCRIPTS/signing-key.sh" import

      - name: Sign and bundle
        if: needs.plan.outputs.central == 'true'
        env:
          SIGNING_KEY: ${{ steps.key.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash "$SCRIPTS/sign-bundles.sh" staging bundles

      - name: Check bundles
        if: needs.plan.outputs.central == 'true'
        env:
          SIGNING_KEY: ${{ steps.key.outputs.fingerprint }}
        run: bash "$SCRIPTS/check-bundles.sh" bundles staging

      # The key is gone before the first request to Maven Central or GitHub.
      - name: Remove the signing key
        if: always()
        run: bash "$SCRIPTS/signing-key.sh" remove

      - name: Upload to Maven Central
        if: needs.plan.outputs.central == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: bash "$SCRIPTS/central-upload.sh" upload bundles staging "$CENTRAL_STATE"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          REPLACE_ASSETS: ${{ inputs.replace-release-assets }}
        run: bash "$SCRIPTS/github-release.sh" staging

      # If the job stops after bundles were uploaded (a step failed, or the run
      # was cancelled, also in the middle of the upload step), do not leave
      # deployments waiting in the Portal: a re-run uploads them again. A
      # deployment that is still being validated is polled until it can be
      # dropped; what cannot be dropped is listed in the job summary.
      - name: Drop Maven Central deployments after a failure
        if: ${{ (failure() || cancelled()) && needs.plan.outputs.central == 'true' }}
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: bash "$SCRIPTS/central-upload.sh" drop "$CENTRAL_STATE"
